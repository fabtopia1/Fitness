name: lifedna
description: LifeDNA OS — Your Personal Performance Operating System
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & DI — Riverpod is the container; there is no service locator.
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Formatting
  intl: ^0.19.0

  # ---------------------------------------------------------------------------
  # The dependencies below are required by the production data layer described in
  # docs/02 and docs/07. They are commented out in this scaffold so that the app
  # builds and runs against the in-memory reference dataset without a Firebase
  # project, signing config or code generation step. Uncomment them together with
  # the corresponding data-layer implementations. See app/README.md.
  # ---------------------------------------------------------------------------
  # firebase_core: ^3.3.0
  # firebase_auth: ^5.1.4
  # cloud_firestore: ^5.2.1
  # firebase_storage: ^12.1.3
  # cloud_functions: ^5.0.4
  # firebase_messaging: ^15.0.4
  # firebase_analytics: ^11.2.1
  # firebase_crashlytics: ^4.0.4
  # firebase_remote_config: ^5.0.4
  # google_sign_in: ^6.2.1
  # sign_in_with_apple: ^6.1.1
  # drift: ^2.19.0
  # sqlite3_flutter_libs: ^0.5.24
  # sqlcipher_flutter_libs: ^0.6.4
  # path_provider: ^2.1.4
  # shared_preferences: ^2.3.1
  # flutter_secure_storage: ^9.2.2
  # health: ^10.2.0
  # flutter_blue_plus: ^1.32.12
  # permission_handler: ^11.3.1
  # flutter_local_notifications: ^17.2.2
  # timezone: ^0.9.4
  # workmanager: ^0.5.2
  # wakelock_plus: ^1.2.8
  # mobile_scanner: ^5.2.3
  # image_picker: ^1.1.2
  # fl_chart: ^0.68.0
  # connectivity_plus: ^6.0.5
  # uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
