name: lifedna
description: "LifeDNA OS — Your Personal Performance Operating System"
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.1.7

  # Auth providers
  google_sign_in: ^6.2.2

  # Local storage (offline-first source of truth)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5

  # Notifications (supplement / meal / workout reminders)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Charts & media
  fl_chart: ^0.69.2
  image_picker: ^1.1.2

  # Platform / connectivity
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1

  # Google Calendar
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # Utilities
  intl: ^0.20.3
  uuid: ^4.5.1
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
