# 4 GB, not the template's 8 GB.
#
# A standard GitHub-hosted runner has 7 GB of RAM in total. An -Xmx8G daemon
# either fails to start or is taken by the OOM killer mid-build, and Gradle
# reports that as "the Gradle build daemon disappeared unexpectedly" rather
# than as a memory error — which costs an afternoon to diagnose. Nothing in
# this project needs more than 4 GB.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError

# Parallel and cached builds. Safe here: one application module, no custom
# tasks with undeclared inputs.
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
