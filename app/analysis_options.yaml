include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "build/**"
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    invalid_annotation_target: ignore
    # TODOs are banned by the project rules; make one fail the build.
    todo: error

linter:
  rules:
    always_use_package_imports: true
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    require_trailing_commas: true
    unawaited_futures: true
    use_super_parameters: true
    cancel_subscriptions: true
    close_sinks: true
    avoid_empty_else: true
    # Off deliberately: a private field fed by a *named* parameter cannot use
    # an initialising formal without leaking the underscore into the public
    # API. Constructor-body assignment is the correct form here.
    prefer_initializing_formals: false
