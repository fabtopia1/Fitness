name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the version the suite is verified against. The Dart formatter's
  # style changes between SDK releases, so an unpinned CI would fail the format
  # gate on code that is correctly formatted locally.
  FLUTTER_VERSION: '3.47.2'
  NODE_VERSION: '20'
  COVERAGE_MIN: '80'

jobs:
  # ---------------------------------------------------------------------------
  # The gate that decides whether the app ships. Analyze, format, layer rules,
  # the full test suite, and the coverage floor.
  # ---------------------------------------------------------------------------
  flutter:
    name: Flutter — analyze, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        working-directory: app
        run: flutter pub get

      # --fatal-infos: the lint set includes `todo: error` and the layering
      # rules, and a warning that is allowed to accumulate is a rule nobody
      # follows.
      - name: Analyze
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Format
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      # The two rules the analyzer cannot express: the pure-Dart domain
      # boundary and no colour literal outside core/theme.
      - name: Layer boundaries and colour discipline
        working-directory: app
        run: python3 tool/check_sources.py

      - name: Test
        working-directory: app
        run: flutter test --coverage --reporter expanded

      - name: Coverage gate
        working-directory: app
        run: dart ../tool/coverage_gate.dart --min ${{ env.COVERAGE_MIN }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Proof that each flavour compiles, links, minifies and packages. A green
  # test suite says nothing about whether the Android toolchain can produce an
  # installable artefact — and this is the ONLY place that can say so, because
  # it is the only environment with an Android SDK. See
  # docs/mvp/19-build-validation-report.md.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: flutter
    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4

      # 21, matching the toolchain the project is developed against. AGP 9 and
      # Gradle 9.3 both run on it, and `compileOptions`/`jvmTarget` pin the
      # emitted bytecode to 17 regardless of the JDK running Gradle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install
        working-directory: app
        run: flutter pub get

      # google-services.json is what makes the Google Services Gradle plugin
      # generate `default_web_client_id`, and it is the prerequisite for the
      # Crashlytics plugin uploading an R8 mapping file. Without it the build
      # still succeeds — local mode is supported — but it is not a beta
      # artefact. See docs/mvp/18-google-auth-verification.md.
      - name: Firebase credentials
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::No GOOGLE_SERVICES_JSON_BASE64 secret. Building"
            echo "::warning::without the Firebase Gradle plugins: Google Sign-In"
            echo "::warning::will not return an ID token in this artefact."
          else
            mkdir -p "app/android/app/src/${{ matrix.flavor }}"
            echo "$GOOGLE_SERVICES_JSON" | base64 -d \
              > "app/android/app/src/${{ matrix.flavor }}/google-services.json"
          fi

      # Release signing. An unsigned-for-release artefact is installable but
      # Play rejects it, and Google Sign-In fails on it unless the debug SHA-1
      # happens to be registered — so the absence is surfaced, not swallowed.
      - name: Release keystore
        if: matrix.flavor != 'dev'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. The release"
            echo "::warning::artefact will be DEBUG-SIGNED and is not"
            echo "::warning::distributable. See docs/mvp/19-build-validation-report.md."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Firebase configuration arrives as --dart-define, never as a committed
      # file. A pull request from a fork has no secrets, so it builds the
      # local-mode binary — which is a supported configuration, not a stub.
      - name: Build APK
        working-directory: app
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build apk \
            --flavor ${{ matrix.flavor }} \
            --${{ matrix.flavor == 'dev' && 'debug' || 'release' }} \
            --dart-define=FLAVOR=${{ matrix.flavor }} \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=GOOGLE_CALENDAR_CLIENT_ID="$GOOGLE_CALENDAR_CLIENT_ID" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      # The AAB is a different packaging path from the APK — a different
      # manifest merge, and per-ABI splitting that only happens here. "The APK
      # built" is not evidence that Play's upload artefact does.
      - name: Build AAB
        if: matrix.flavor != 'dev'
        working-directory: app
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build appbundle \
            --flavor ${{ matrix.flavor }} \
            --release \
            --dart-define=FLAVOR=${{ matrix.flavor }} \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=GOOGLE_CALENDAR_CLIENT_ID="$GOOGLE_CALENDAR_CLIENT_ID" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      # R8 renames every class in a release build. Without the mapping file,
      # every Crashlytics report from the beta is an unreadable stack of
      # a.b.c() — and the file is regenerated on each build, so an artefact
      # kept without its mapping can never be symbolicated again.
      - name: Upload R8 mapping
        if: matrix.flavor != 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: lifedna-${{ matrix.flavor }}-mapping
          path: app/build/app/outputs/mapping/${{ matrix.flavor }}Release/mapping.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifedna-${{ matrix.flavor }}-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Upload AAB
        if: matrix.flavor != 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: lifedna-${{ matrix.flavor }}-aab
          path: app/build/app/outputs/bundle/${{ matrix.flavor }}Release/*.aab
          retention-days: 14
          if-no-files-found: error

      # Secrets on disk outlive the step that wrote them. The runner is
      # ephemeral, but a workflow change that adds a later step should not be
      # the thing that discovers this.
      - name: Remove credentials
        if: always()
        run: |
          rm -f app/android/key.properties app/android/app/upload-keystore.jks
          rm -f app/android/app/src/*/google-services.json

  # ---------------------------------------------------------------------------
  # The journeys, on a real emulator. Slower and flakier than the headless run,
  # so it does not gate a pull request — but it must be green before a release.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: flutter
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install
        working-directory: app
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd app && flutter test integration_test/app_test.dart

  # ---------------------------------------------------------------------------
  # Firestore rules are the only thing between one user's data and another's.
  # They are tested against the emulator, not reviewed by eye.
  # ---------------------------------------------------------------------------
  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # firebase-tools is a dev dependency of the suite rather than a global
      # install, so CI runs the same emulator version a developer does.
      - name: Rules test suite
        working-directory: firebase/rules-test
        run: |
          npm ci
          npm run emulator

  # ---------------------------------------------------------------------------
  # The engines exist twice — Dart on the client, TypeScript on the server —
  # and a divergence means a user sees one number before syncing and another
  # after. Fixtures generated by a third, independent implementation bind both.
  # ---------------------------------------------------------------------------
  engine-parity:
    name: Engine parity (Dart ↔ TypeScript ↔ spec)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fixtures are current
        run: |
          python3 tool/generate_engine_fixtures.py
          if ! git diff --quiet test/fixtures/engines; then
            echo "::error::Engine fixtures are stale. A formula changed without"
            echo "::error::regenerating them, or the generator disagrees with the spec."
            git diff --stat test/fixtures/engines
            exit 1
          fi

      - name: Dart engines match the fixtures
        working-directory: app
        run: |
          flutter pub get
          flutter test test/unit/core/engines/parity_test.dart

      - name: TypeScript engines match the fixtures
        working-directory: functions
        run: |
          npm ci
          npm test -- test/engines/parity.test.ts

      # Math.round and Dart's num.round() disagree on negative halves, and
      # projectedWeeklyChangeKg is negative for every user in a deficit.
      - name: No platform rounding inside the engines
        working-directory: functions
        run: |
          if grep -rn "Math\.round" src/engines --include="*.ts" \
             | grep -v "^\s*//" | grep -v "\* "; then
            echo "::error::Use roundHalfAwayFromZero from lib/rounding.ts."
            exit 1
          fi

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: No committed secrets
        run: |
          # These files are gitignored; a commit means credentials leaked.
          for f in google-services.json GoogleService-Info.plist \
                   firebase_options.dart serviceAccountKey.json key.properties; do
            if git ls-files --error-unmatch "**/$f" 2>/dev/null; then
              echo "::error::$f must never be committed."
              exit 1
            fi
          done
          if git grep -nE "(AIza[0-9A-Za-z_-]{35}|sk-ant-[A-Za-z0-9_-]{20,})" \
             -- . ':!*.example' ':!.github/workflows/*'; then
            echo "::error::A live API key appears to be committed."
            exit 1
          fi
          echo "No committed secrets."

      # An app that ships a keystore or a signing password in the repository is
      # an app anyone can publish an update to.
      - name: No keystore in the tree
        run: |
          if git ls-files | grep -E '\.(jks|keystore|p12|pem)$'; then
            echo "::error::A signing key is committed."
            exit 1
          fi
          echo "No signing material committed."
